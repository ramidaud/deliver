<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Rami Daud Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #f5f1ea;
  --ink:    #2a2522;
  --muted:  #7a6f63;
  --accent: #6c47ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
}
h1 {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 1.8rem;
  margin-bottom: 12px;
}
p { color: var(--muted); font-size: 15px; line-height: 1.6; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 420px; }
.rule { width: 40px; height: 1px; background: var(--muted); opacity: .4; margin: 22px auto; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Rami Daud Photography</h1>
    <div class="rule"></div>
    <p>
      Client galleries are delivered by private link. If you're looking for
      yours and don't have the link, email
      <a href="mailto:ramidaud@me.com">ramidaud@me.com</a>.
    </p>
  </div>
</body>
</html>
